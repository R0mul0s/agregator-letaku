# Agregátor letáků — nginx default site pro vývoj
#
# @author Roman Hlaváček
# @created 2026-10-02

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # CSP tu není — zablokovala by Vite dev server s HMR na jiném portu.
    # Ostatní bezpečnostní hlavičky stejně jako public/.htaccess na produkci (R45).
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
    add_header Cross-Origin-Opener-Policy "same-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    # robots.txt, sitemap.xml a llms.txt generuje aplikace (R45)
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        # Verze PHP do odpovědi nepatří (R45)
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
