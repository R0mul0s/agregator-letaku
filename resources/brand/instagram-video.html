<!doctype html>
<!--
    Zdroj videa pro Instagram — košík Slevohlídky jede jako v hero sekci úvodní stránky
    (resources/scss/pages/_landing.scss, R44). Jeden snímek: čas v ?t= (sekundy), varianta
    ?v=text (košík, název, motto a web) nebo ?v=plain (jen košík). Animace stojí a záporné
    zpoždění = čas snímku, takže prohlížeč vykreslí přesně ten okamžik se stejným easingem
    jako web. Smyčka 3,6 s (jízda 3,6 s, hrboly 0,45 s, čárky 0,9 s) se opakuje bez skoku.
    Plátno 1080 × 1920 (9:16), obsah ve středovém čtverci 1080 × 1080 — 4:5 a 1:1 jsou ořez.

    Vykreslení (Git Bash, z rootu repa; ~1 s na snímek, 108 snímků na variantu):
      D=$(pwd -W); for v in text plain; do mkdir -p storage/app/video/$v; for i in $(seq 0 107); do
        msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --allow-file-access-from-files \
          --virtual-time-budget=1500 --window-size=1080,1920 --screenshot="$D/storage/app/video/$v/$(printf %03d $i).png" \
          "file:///$D/resources/brand/instagram-video.html?v=$v&t=$(awk "BEGIN{print $i/30}")"; done; done
    Složení (ffmpeg v Dockeru, 3 smyčky = 10,8 s, H.264 pro Instagram; ořez 4:5 crop=1080:1350,
    1:1 crop=1080:1080, jinak bez filtru):
      MSYS_NO_PATHCONV=1 docker run --rm -v "$D/storage/app/video:/v" linuxserver/ffmpeg -framerate 30 \
        -stream_loop 2 -i /v/text/%03d.png -vf crop=1080:1350 -c:v libx264 -pix_fmt yuv420p -crf 18 \
        -movflags +faststart /v/slevohlidka-text-4x5.mp4

    @author Roman Hlaváček
    @created 2026-10-06
-->
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
    @font-face {
        font-family: 'Nunito Variable';
        font-weight: 200 1000;
        src: url('../../node_modules/@fontsource-variable/nunito/files/nunito-latin-ext-wght-normal.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
        font-family: 'Nunito Variable';
        font-weight: 200 1000;
        src: url('../../node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
        /* Stejné poměry jako web (rem), jen větší: 16rem kruhu = 600 px */
        font-size: 37.5px;
        --t: 0;
        --color-brand: #f42630;
        --color-text: #1f222a;
        --color-text-muted: #5c6370;
        --gradient-brand: linear-gradient(135deg, #f42630 0%, #c00010 100%);
        --gradient-hero: radial-gradient(ellipse at 30% 20%, #fdecec 0%, #ffffff 65%);
        --shadow: 0 0.06rem 0.12rem rgb(31 34 42 / 8%), 0 0.4rem 1rem rgb(31 34 42 / 12%);
        --sticker-rotation: -6deg;
        /* Smyčka 3,6 s: jízda 3,6 s, hrboly 0,45 s (8×), čárky 0,9 s (4×) — video se opakuje bez skoku */
        --drive: 3.6s;
        --bump: 0.45s;
        --streak: 0.9s;
        --drive-distance: 0.6rem;
        --bump-height: 0.25rem;
        --bump-tilt: 1.5deg;
        --streak-travel: 2.5rem;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
    }

    body {
        display: grid;
        place-items: center;
        background: var(--gradient-hero);
        color: var(--color-text);
        font-family: 'Nunito Variable', sans-serif;
    }

    /* Středový čtverec — co je v něm, zůstane i v ořezu 4:5 a 1:1 */
    .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        width: 1080px;
        height: 1080px;
    }

    .art { position: relative; }

    .circle {
        position: relative;
        width: 16rem;
        height: 16rem;
        overflow: hidden;
        background: #ffffff;
        border-radius: 50%;
        box-shadow: var(--shadow);
    }

    .plain .circle { width: 19rem; height: 19rem; }

    /* Animace stojí, záporné zpoždění = čas snímku (+ vlastní posun čárek jako na webu) */
    .drive, .mascot, .streak, .sticker {
        animation-play-state: paused !important;
    }

    .drive {
        position: absolute;
        inset: 1.5rem;
        animation: drive var(--drive) ease-in-out infinite;
        animation-delay: calc(var(--t) * -1s);
    }

    .mascot {
        display: block;
        width: 100%;
        height: auto;
        transform-origin: 50% 85%;
        animation: bump var(--bump) ease-in-out infinite;
        animation-delay: calc(var(--t) * -1s);
    }

    .streak {
        position: absolute;
        left: 8%;
        height: 0.4rem;
        background: var(--color-brand);
        border-radius: 999px;
        opacity: 0;
        animation: streak var(--streak) linear infinite;
    }
    .streak:nth-child(1) { top: 44%; width: 3.5rem; animation-delay: calc(var(--t) * -1s); }
    .streak:nth-child(2) { top: 54%; width: 2.5rem; animation-delay: calc(var(--t) * -1s - var(--streak) / 3); }
    .streak:nth-child(3) { top: 64%; width: 1.75rem; animation-delay: calc(var(--t) * -1s - var(--streak) / 1.5); }

    .sticker {
        position: absolute;
        top: 1rem;
        right: -1rem;
        padding: 0.25rem 1rem;
        background: var(--gradient-brand);
        border-radius: 0.5rem;
        box-shadow: var(--shadow);
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: 900;
        transform: rotate(var(--sticker-rotation));
        animation: sticker var(--drive) ease-in-out infinite;
        animation-delay: calc(var(--t) * -1s);
    }

    .name {
        margin-top: 0.4rem;
        font-size: 2.9rem;
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 1;
    }
    .name span { color: var(--color-brand); }

    .tagline {
        color: var(--color-text-muted);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .url {
        margin-top: 0.4rem;
        padding: 0.35rem 1.3rem;
        background: var(--gradient-brand);
        border-radius: 999px;
        box-shadow: 0 0.12rem 0 #a5121b;
        color: #ffffff;
        font-size: 1.4rem;
        font-weight: 800;
    }

    @keyframes drive {
        0%, 100% { transform: translateX(calc(-1 * var(--drive-distance))); }
        50% { transform: translateX(var(--drive-distance)); }
    }
    @keyframes bump {
        0%, 100% { transform: translateY(0) rotate(0); }
        30% { transform: translateY(calc(-1 * var(--bump-height))) rotate(calc(-1 * var(--bump-tilt))); }
        60% { transform: translateY(0) rotate(var(--bump-tilt)); }
    }
    @keyframes streak {
        0% { opacity: 0; transform: translateX(var(--streak-travel)); }
        20%, 70% { opacity: 0.85; }
        100% { opacity: 0; transform: translateX(calc(-1 * var(--streak-travel))); }
    }
    @keyframes sticker {
        0%, 100% { transform: rotate(var(--sticker-rotation)); }
        50% { transform: rotate(calc(var(--sticker-rotation) * 1.8)) translateY(calc(-1 * var(--bump-height))); }
    }
</style>
</head>
<body>
    <main class="stage" id="stage">
        <div class="art">
            <div class="circle">
                <span class="streak"></span>
                <span class="streak"></span>
                <span class="streak"></span>
                <div class="drive"><img src="../../public/images/brand/icon-512.png" alt="" class="mascot"></div>
            </div>
            <span class="sticker" id="sticker">−50 %</span>
        </div>
        <p class="name" id="name"><span>Slevo</span>hlídka</p>
        <p class="tagline" id="tagline">Rychlý lovec slev</p>
        <p class="url" id="url">slevohlidka.cz</p>
    </main>
    <script>
        const params = new URLSearchParams(location.search);
        document.documentElement.style.setProperty('--t', params.get('t') ?? '0');
        if (params.get('v') === 'plain') {
            document.getElementById('stage').classList.add('plain');
            ['sticker', 'name', 'tagline', 'url'].forEach((id) => document.getElementById(id).remove());
        }
    </script>
</body>
</html>
