<!doctype html>
<!--
    Zdroj obrázků aplikace v telefonu (R66) do public/images/brand — druh podle parametru adresy:
      ?kind=maskable  icon-maskable-512.png — logo v bezpečné zóně (80 %) na plném podkladu,
                      Android ikonu ořízne do kruhu nebo čtverce (manifest, purpose maskable)
      ?kind=badge     badge-96.png — bílá silueta maskota na průhledném pozadí, Android ji ukáže
                      ve stavovém řádku u upozornění (jen bílá, barvy systém zahodí)
      ?kind=splash    splash-{š}x{v}x{hustota}.png — úvodní obrazovka iPhonu (rozměry
                      z config/letaky.php pwa.startup_images)
    Vykreslení (headless Edge, z rootu repa, cesta k souboru absolutně):
      msedge --headless=new --hide-scrollbars --window-size=512,512 \
        --screenshot=public/images/brand/icon-maskable-512.png "file:///…/resources/brand/app-images.html?kind=maskable"
      msedge --headless=new --hide-scrollbars --default-background-color=00000000 --window-size=600,600 --force-device-scale-factor=0.16 \
        --screenshot=public/images/brand/badge-96.png "file:///…/resources/brand/app-images.html?kind=badge"
      msedge --headless=new --hide-scrollbars --window-size=1179,2556 \
        --screenshot=public/images/brand/splash-393x852x3.png "file:///…/resources/brand/app-images.html?kind=splash"
    Edge má nejmenší šířku okna kolem 500 px: úvodní obrazovka se proto kreslí rovnou ve
    fyzických pixelech (šířka × hustota) a silueta 96 px jako okno 600 px zmenšené na 0,16.
    Barvy odpovídají tokenům v resources/scss/base/_tokens.scss (světlý režim).

    @author Roman Hlaváček
    @created 2026-10-04
-->
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    img { display: block; }

    /* Maskovatelná ikona: bílý podklad jako u icon-512, logo v kruhu 80 % průměru */
    .maskable { background: #ffffff; }
    .maskable img { width: 76%; }

    /* Silueta pro stavový řádek: tvar maskota, barva jen bílá */
    .badge { background: transparent; }
    .badge img { width: 88%; filter: brightness(0) invert(1); }

    /* Úvodní obrazovka: podklad stránky (--color-bg) a logo s názvem uprostřed */
    .splash { background: #f4f6f8; }
    .splash img { width: 52%; }
</style>
</head>
<body>
<img id="image" alt="">
<script>
    const kind = new URLSearchParams(location.search).get('kind') ?? 'splash';
    const sources = { maskable: 'icon-512.png', badge: 'logo-mark.png', splash: 'logo.png' };
    document.body.className = kind;
    document.getElementById('image').src = `../../public/images/brand/${sources[kind]}`;
</script>
</body>
</html>
